name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova & Create Project
        run: |
          npm install -g cordova
          cordova create easywatts_app co.za.easywatts.solar "EasyWatts Solar Sizer"
          cd easywatts_app
          cordova platform add android
          rm -rf www/*
          
          # Automatically find any .html file in the repository root and copy it as index.html
          HTML_FILE=$(find .. -maxdepth 1 -name "*.html" | head -n 1)
          if [ -z "$HTML_FILE" ]; then
            echo "Error: No HTML file found in repository root!"
            exit 1
          fi
          echo "Found and using HTML file: $HTML_FILE"
          cp "$HTML_FILE" www/index.html

      - name: Build Android Debug APK
        run: |
          cd easywatts_app
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easywatts-debug-apk
          path: easywatts_app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
